name: Publish NuGet packages

# Publishes VertaIT.WPF.Theme (net472) and VertaIT.WPF.NetTheme (net10.0-windows)
# to nuget.org using Trusted Publishing (no long-lived API key).
#
# Release: push a tag like "v1.0.0" -> package version 1.0.0.
# Manual run (workflow_dispatch) builds and uploads the packages as an artifact only.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: windows-latest
    environment: nuget
    permissions:
      contents: read
      id-token: write # required for NuGet Trusted Publishing (OIDC)

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - uses: microsoft/setup-msbuild@v3

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "args=-p:Version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "args=" >> "$GITHUB_OUTPUT"
          fi

      - name: Pack VertaIT.WPF.Theme (net472)
        run: msbuild Source/VertaIT.WPF.Theme/VertaIT.WPF.Theme.csproj -restore -t:Build,Pack -p:Configuration=Release ${{ steps.version.outputs.args }} -v:m

      - name: Pack VertaIT.WPF.NetTheme (net10.0-windows)
        run: dotnet pack Source/VertaIT.WPF.NetTheme/VertaIT.WPF.NetTheme.csproj -c Release ${{ steps.version.outputs.args }}

      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: artifacts/packages/*.nupkg

      - name: NuGet login (Trusted Publishing)
        if: startsWith(github.ref, 'refs/tags/v')
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push to nuget.org
        if: startsWith(github.ref, 'refs/tags/v')
        run: dotnet nuget push "artifacts/packages/*.nupkg" --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
